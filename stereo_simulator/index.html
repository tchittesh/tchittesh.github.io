<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stereo Camera Visualizer</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      .intersection-info {
        position: absolute;
        bottom: 10px;
        left: 10px;
        padding: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: monospace;
        display: block;
        white-space: pre-line;
        max-width: 300px;
        border-radius: 5px;
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="intersection-info" class="intersection-info">Hint: Click on any intersections to show triangulation dimensions/uncertainties</div>
    <a
      href="https://github.com/tchittesh/tchittesh.github.io/tree/main/stereo_simulator"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="View source on GitHub"
      style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        z-index: 1000;
        opacity: 0.7;
        transition: opacity 0.2s ease-in-out;
      "
      onmouseover="this.style.opacity='1'"
      onmouseout="this.style.opacity='0.7'">
      <img src="GitHub_Invertocat_Light.png" alt="GitHub" style="width: 100%; height: 100%;" />
    </a>
    <script type="module" src="./main.js"></script>
  </body>
</html>
